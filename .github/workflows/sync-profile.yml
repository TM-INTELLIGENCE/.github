name: sync-profile

on:
  push:
    paths:
      - "catalog/repos.yml"
      - "profile/README.template.md"
      - "scripts/generate_profile_readme.py"
      - "scripts/sync_repo_metadata.py"
      - ".github/workflows/sync-profile.yml"
  schedule:
    # Monday 07:15 UTC — catch drift / new repos added outside catalog discipline
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Generate profile README
        run: python3 scripts/generate_profile_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(profile): regenerate org README from catalog"
          git push

      - name: Sync repo descriptions & topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_repo_metadata.py
        # default GITHUB_TOKEN can patch repos in the same org if permissions allow;
        # if topics/descriptions fail, add an org PAT as PROFILE_SYNC_TOKEN later.
        continue-on-error: true
